<!doctype html>
<html lang="vi" data-platform="darwin">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>VXChat</title>
  <link rel="stylesheet" href="shared/titlebar_tokens.css">
  <link rel="stylesheet" href="shell.css">
</head>
<body class="shell-body">
  <header id="chrome">
  <div data-vx-titlebar="standard_32" id="titlebar">
    <div data-vx-titlebar-brand><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span data-vx-titlebar-name>VXChat</span></div>
    <div data-vx-titlebar-actions>
      <button id="menu-btn" class="nav-btn menu-btn" type="button" title="Menu">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16"/><path d="M4 12h16"/><path d="M4 19h16"/></svg>
      </button>
      <span data-vx-titlebar-spacer></span>
      <button id="setup-btn" class="nav-btn" type="button" title="Thiết lập Facebook" hidden>
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/></svg>
      </button>
      <span id="status" class="nav-status" role="status"></span>
      <button id="downloads-btn" class="nav-btn" type="button" title="Tệp đã tải">
        <span id="downloads-icon" data-icon="download">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3"/><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/></svg>
        </span>
      </button>
      <span id="downloads-live" class="sr-only" aria-live="polite"></span>
      <button id="reload" class="nav-btn" type="button" aria-label="Tải lại / Reload" title="Tải lại / Reload (Cmd/Ctrl+R)">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg>
      </button>
      <button id="settings-btn" data-vx-titlebar-settings type="button" aria-label="Cài đặt / Settings" title="Cài đặt / Settings (Cmd/Ctrl+,)">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m9.2 3-.7 2.1-1.6.9-2.2-.4-2 3.5 1.5 1.7v1.9l-1.5 1.7 2 3.5 2.2-.4 1.6.9.7 2.1h4l.7-2.1 1.6-.9 2.2.4 2-3.5-1.5-1.7v-1.9l1.5-1.7-2-3.5-2.2.4-1.6-.9-.7-2.1z"/><circle cx="11.2" cy="11.8" r="3"/></svg>
      </button>
    </div>
  </div>
  <nav aria-label="Thanh tab / Tabs" class="nav-bar">
    <div id="tabs-wrapper" class="tabs-wrapper">
      <div id="tabs" class="tabs-list" role="tablist"></div>
      <button id="tabs-overflow-btn" class="tabs-overflow-btn" type="button" aria-expanded="false" aria-controls="tabs-overflow-panel" title="Dịch vụ ẩn / Tab bị khuất" aria-label="Dịch vụ ẩn / Tab bị khuất" hidden>
        <span class="overflow-icon" aria-hidden="true"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/></svg></span>
        <span id="tabs-overflow-count" class="overflow-count" hidden></span>
        <span class="overflow-arrow" aria-hidden="true"><svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></span>
      </button>
    </div>
    <span id="page-location" class="page-location" aria-label="Trang hiện tại"></span>
    <button id="manage-services" class="nav-btn" type="button" aria-expanded="false" aria-controls="service-manager" hidden style="display:none!important;">⋯</button>
  </nav>
  <div id="tabs-overflow-panel" class="tabs-overflow-panel floating-dropdown" hidden></div>
  <div id="service-manager" hidden></div>
  <div id="workflow" class="workflow" hidden></div>
  <div id="service-plus-panel" class="chrome-panel floating-dropdown" hidden></div>
  <div id="account-actions-panel" class="chrome-panel floating-dropdown" hidden></div>
  <div id="profile-panel" class="chrome-panel" hidden>
    <div class="profile-panel-row">
      <span id="profile-panel-title" class="profile-panel-title">Thêm tài khoản</span>
      <input type="hidden" id="profile-service-id">
      <input type="hidden" id="profile-edit-id">
      <input type="text" id="profile-label-input" class="profile-panel-input" maxlength="32" placeholder="Nhãn: Work, Cá nhân...">
      <div id="profile-color-picker" class="color-picker-inline"></div>
      <button type="button" id="profile-save-btn" class="profile-panel-btn profile-panel-btn-primary">Lưu</button>
      <button type="button" id="profile-cancel-btn" class="profile-panel-btn">Hủy</button>
      <button type="button" id="profile-close-btn" class="panel-close-btn" aria-label="Đóng">×</button>
    </div>
  </div>
  <div id="custom-service-panel" class="chrome-panel" hidden>
    <div class="custom-service-container">
      <div class="custom-service-header">
        <span id="custom-service-panel-title" class="profile-panel-title">Thêm dịch vụ thủ công</span>
        <button type="button" id="custom-service-close-btn" class="panel-close-btn" aria-label="Đóng">×</button>
      </div>
      <form id="custom-service-form" class="custom-service-form" onsubmit="return false;">
        <div class="custom-service-row">
          <div class="custom-service-field">
            <label for="custom-service-label-input" id="custom-service-label-desc">Tên dịch vụ</label>
            <input type="text" id="custom-service-label-input" class="profile-panel-input" maxlength="32" placeholder="Ví dụ: Mattermost, Intranet..." required>
          </div>
          <div class="custom-service-field">
            <label for="custom-service-url-input" id="custom-service-url-desc">Link dịch vụ (Service URL)</label>
            <input type="text" id="custom-service-url-input" class="profile-panel-input" placeholder="Ví dụ: web.telegram.org hoặc https://..." required autocomplete="off">
          </div>
          <div class="custom-service-field">
            <label for="custom-service-login-url-input" id="custom-service-login-desc">Link đăng nhập (Login URL - tùy chọn)</label>
            <input type="text" id="custom-service-login-url-input" class="profile-panel-input" placeholder="Ví dụ: discord.com/login (mặc định như link dịch vụ)" autocomplete="off">
          </div>
        </div>
        <div class="custom-service-icons-section">
          <label id="custom-service-icon-desc">Chọn biểu tượng</label>
          <div id="custom-service-icon-picker" class="icon-picker-grid"></div>
        </div>
        <div id="custom-service-error" class="custom-service-error" hidden></div>
        <div class="custom-service-actions">
          <button type="button" id="custom-service-cancel-btn" class="profile-panel-btn">Hủy</button>
          <button type="submit" id="custom-service-save-btn" class="profile-panel-btn profile-panel-btn-primary">Thêm dịch vụ</button>
        </div>
      </form>
    </div>
  </div>
  </header>
  <script src="tab_order.js"></script>
  <script src="tab_overflow.js"></script>
  <script src="download_feedback.js"></script>
  <script src="shell.js"></script>
</body>
</html>
